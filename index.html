<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2f6a5a">
<title>Yum — Fiche de pointage</title>
<meta name="description" content="Yum / Yahtzee-style score sheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f4c842'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-family='Arial Black' font-size='34' fill='%232f6a5a'%3Eyum%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --green: #2f6a5a;
    --green-dark: #235244;
    --green-light: #c3dcd2;
    --green-row: #d8e8e0;
    --yellow: #f4c842;
    --yellow-light: #fbe9a8;
    --text: #1d3a32;
    --ink: #1a3a8a;
    --border: #2f6a5a;
    --paper: #fbfaf3;
    /* Used by the 3D dice overlay (ported from yum) */
    --bg:    #0a1814;
    --card:  #14302a;
    --panel: #1f4a3f;
    --gold:  #f4c842;
    --white: #ffffff;
    --muted: rgba(255,255,255,0.72);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: #5a3a22;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(0,0,0,0.25), transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(0,0,0,0.25), transparent 60%),
      repeating-linear-gradient(115deg, #6b4527 0 6px, #5a3a22 6px 12px, #4a2f1c 12px 18px);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--text);
    min-height: 100vh;
    -webkit-text-size-adjust: 100%;
  }
  .toolbar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(35,82,68,0.95);
    color: #fff;
    padding: 10px 14px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
  .toolbar h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    flex: 1;
    letter-spacing: 0.3px;
  }
  .toolbar button {
    background: var(--yellow);
    color: var(--green-dark);
    border: none;
    padding: 8px 14px;
    border-radius: 6px;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 2px 0 rgba(0,0,0,0.2);
  }
  .toolbar button:active { transform: translateY(1px); box-shadow: 0 1px 0 rgba(0,0,0,0.2); }
  .toolbar button.ghost {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255,255,255,0.5);
    box-shadow: none;
  }
  .lang-toggle {
    display: inline-flex;
    border: 1px solid rgba(255,255,255,0.5);
    border-radius: 6px;
    overflow: hidden;
  }
  .lang-toggle button {
    background: transparent;
    color: #fff;
    border: none;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    box-shadow: none;
    border-radius: 0;
  }
  .lang-toggle button + button { border-left: 1px solid rgba(255,255,255,0.5); }
  .lang-toggle button.active {
    background: var(--yellow);
    color: var(--green-dark);
  }
  body.lang-fr .en { display: none !important; }
  body.lang-en .fr { display: none !important; }

  /* Mode toggle reuses lang-toggle styling */
  body.mode-yum .yahtzee-only { display: none !important; }
  body.mode-yahtzee .yum-only { display: none !important; }

  /* Yahtzee logo (red) when in Yahtzee mode */
  .logo.yahtzee-logo {
    background: #c8302c;
    color: #fff;
    font-family: "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 26px;
    letter-spacing: 1px;
    padding: 10px 14px;
  }
  .logo.yahtzee-logo .reg { color: #fff; }

  .card {
    max-width: 980px;
    margin: 16px auto 40px;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    padding: 14px 12px 18px;
  }

  .sheet-tabs {
    display: flex;
    justify-content: center;
    gap: 4px;
    padding: 4px 0 10px;
    border-bottom: 1px solid #d6d2bf;
    margin-bottom: 6px;
  }
  .sheet-tab {
    flex: 1;
    max-width: 80px;
    min-width: 0;
    background: var(--green-row);
    color: var(--green-dark);
    border: 1.5px solid var(--green);
    border-radius: 6px;
    padding: 8px 4px;
    font-weight: 800;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    transition: transform 0.05s, background 0.1s;
  }
  .sheet-tab:active { transform: translateY(1px); }
  .sheet-tab.active {
    background: var(--yellow);
    border-color: var(--yellow);
    color: var(--green-dark);
    box-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .sheet-tab .tab-name {
    display: block;
    font-size: 9.5px;
    font-weight: 700;
    opacity: 0.75;
    margin-top: 2px;
    line-height: 1;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .sheet-tab.active .tab-name { opacity: 1; }

  .header {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 8px;
    padding: 4px 6px 14px;
    border-bottom: 1px solid #d6d2bf;
    margin-bottom: 8px;
  }
  .logo {
    background: var(--yellow);
    color: var(--green-dark);
    font-family: "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 38px;
    line-height: 1;
    padding: 6px 14px 8px;
    border-radius: 8px;
    letter-spacing: -1px;
    position: relative;
  }
  .logo .reg {
    font-size: 10px;
    vertical-align: top;
    font-style: normal;
    margin-left: 2px;
  }
  .logo .tag {
    display: block;
    font-family: inherit;
    font-weight: 700;
    font-style: italic;
    font-size: 9px;
    letter-spacing: 0.5px;
    color: var(--green-dark);
    margin-top: -2px;
  }
  .title {
    text-align: center;
    color: var(--green-dark);
    font-weight: 700;
    line-height: 1.1;
  }
  .title .fr { font-size: 18px; font-style: italic; }
  .title .en { font-size: 16px; font-style: italic; }
  .player {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--green-dark);
    font-weight: 700;
  }
  .player-labels { text-align: right; line-height: 1.1; }
  .player input {
    border: none;
    border-bottom: 1.5px solid var(--green-dark);
    background: transparent;
    width: 110px;
    font-size: 18px;
    color: var(--ink);
    font-family: "Comic Sans MS", "Bradley Hand", cursive;
    padding: 2px 4px;
    outline: none;
  }

  table.sheet {
    width: 100%;
    border-collapse: collapse;
    background: var(--paper);
    margin-bottom: 10px;
    table-layout: fixed;
  }
  table.sheet th, table.sheet td {
    border: 1.5px solid var(--green);
    padding: 0;
    text-align: center;
    vertical-align: middle;
    height: 38px;
    font-size: 12px;
    color: var(--green-dark);
    background: var(--green-row);
  }
  table.sheet thead th {
    background: var(--green);
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.3px;
    height: 34px;
  }
  table.sheet thead th.col-num {
    background: var(--green);
    color: #fff;
    font-size: 14px;
    width: 9%;
  }
  td.label {
    text-align: left;
    padding: 4px 8px;
    line-height: 1.05;
    background: var(--green-row);
    font-weight: 700;
  }
  td.label .label-inner {
    display: flex;
    align-items: center;
    gap: 6px;
    width: 100%;
  }
  td.label .label-inner.upper-label { justify-content: center; gap: 10px; }
  td.label .label-text { flex: 1; min-width: 0; }
  td.label .fr { display: block; font-size: 12px; }
  td.label .en { display: block; font-size: 10.5px; font-style: italic; opacity: 0.85; }
  td.label .num {
    color: var(--green-dark);
    font-size: 22px;
    font-weight: 900;
    line-height: 1;
    flex-shrink: 0;
    min-width: 18px;
    text-align: center;
  }
  td.label .label-inner .die { flex-shrink: 0; }
  td.maxscore {
    background: var(--green-row);
    font-weight: 700;
    font-size: 13px;
    color: var(--green-dark);
  }
  td.maxscore .max-inner {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  td.maxscore .maxnum {
    font-size: 18px;
    font-weight: 900;
  }
  td.maxscore .dice {
    display: inline-flex;
    align-items: center;
  }
  td.maxscore .maxlabel {
    font-size: 10.5px;
    line-height: 1.15;
    text-align: center;
  }
  td.maxscore .maxlabel .fr,
  td.maxscore .maxlabel .en { display: block; }
  td.maxscore .maxlabel .en { font-style: italic; }

  td.input-cell {
    background: #fff;
    padding: 0;
  }
  td.input-cell input {
    width: 100%;
    height: 100%;
    min-height: 36px;
    border: none;
    background: transparent;
    text-align: center;
    font-family: "Comic Sans MS", "Bradley Hand", cursive;
    color: var(--ink);
    font-size: 18px;
    padding: 0;
    outline: none;
    -moz-appearance: textfield;
    caret-color: transparent;
    cursor: pointer;
  }
  td.input-cell input::-webkit-outer-spin-button,
  td.input-cell input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  td.input-cell input:focus {
    background: #fff8d6;
  }
  td.input-cell.scratched { background: #f6e6e6; }
  td.input-cell.scratched input { color: #b0473a; font-size: 22px; }

  /* Picker overlay */
  .picker-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 14px;
    animation: fadeIn 0.12s ease-out;
  }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  .picker {
    background: var(--paper);
    border-radius: 12px;
    width: 100%;
    max-width: 360px;
    padding: 14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    border-top: 8px solid var(--green);
    animation: slideUp 0.18s ease-out;
  }
  @keyframes slideUp { from { transform: translateY(10px); opacity: 0 } to { transform: none; opacity: 1 } }
  .picker .head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 4px;
  }
  .picker .head .title {
    font-weight: 700;
    color: var(--green-dark);
    font-size: 14px;
  }
  .picker .head .col {
    font-size: 11px;
    color: var(--green-dark);
    opacity: 0.7;
    font-weight: 700;
  }
  .picker .hint {
    font-size: 11px;
    color: var(--green-dark);
    opacity: 0.7;
    margin-bottom: 10px;
    font-style: italic;
  }
  .picker .chips {
    display: grid;
    gap: 8px;
    grid-template-columns: repeat(3, 1fr);
  }
  .picker .chips.sum {
    grid-template-columns: repeat(5, 1fr);
  }
  .chip {
    background: var(--green-row);
    color: var(--green-dark);
    border: 1.5px solid var(--green);
    border-radius: 8px;
    padding: 12px 0;
    text-align: center;
    font-weight: 700;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.05s, background 0.1s;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .chip:active { transform: scale(0.95); background: var(--yellow-light); }
  .chip.scratch {
    background: #f6e6e6;
    color: #b0473a;
    border-color: #b0473a;
    font-size: 22px;
  }
  .chip.current { background: var(--yellow); border-color: var(--yellow); }
  .picker .actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
  .picker .actions button {
    flex: 1;
    border: 1.5px solid var(--green);
    background: transparent;
    color: var(--green-dark);
    padding: 10px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
  }
  .picker .actions button.primary {
    background: var(--green);
    color: #fff;
  }

  .picker.bonus-info { max-width: 380px; }
  .picker.bonus-info .bonus-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin: 10px 0 4px;
  }
  .picker.bonus-info .bonus-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 10px;
    border-radius: 6px;
    background: var(--green-row);
    border: 1.5px solid var(--green);
    font-size: 13px;
    color: var(--green-dark);
  }
  .picker.bonus-info .bonus-row .target { font-weight: 700; }
  .picker.bonus-info .bonus-row .status { font-size: 12px; font-weight: 600; }
  .picker.bonus-info .bonus-row.complete {
    background: #d6ebd6;
    border-color: #4a8a4a;
  }
  .picker.bonus-info .bonus-row.extra {
    background: var(--yellow-light);
    border-color: var(--yellow);
  }
  .picker.bonus-info .bonus-row.scratched {
    background: #f6e6e6;
    border-color: #b0473a;
    color: #b0473a;
  }
  .picker.bonus-info .bonus-row.short {
    background: #fff;
    border-color: var(--green-dark);
  }
  .picker.bonus-info .summary {
    margin-top: 8px;
    padding: 10px;
    background: var(--green);
    color: #fff;
    border-radius: 6px;
    text-align: center;
    font-weight: 700;
    font-size: 13px;
  }
  .picker.bonus-info .summary.reached {
    background: var(--yellow);
    color: var(--green-dark);
  }

  tr.bonus td.input-cell { cursor: pointer; }
  tr.bonus td.input-cell input { cursor: pointer; pointer-events: none; }

  tr.computed td.input-cell { background: #f3eedd; }
  tr.computed td.input-cell input { font-weight: 700; color: var(--green-dark); }

  tr.bonus td.label, tr.bonus td.maxscore { background: var(--yellow); color: var(--green-dark); }
  tr.bonus td.label .fr, tr.bonus td.label .en { font-weight: 700; }
  tr.total td.label, tr.total td.maxscore { background: var(--green); color: #fff; }
  tr.total td.label { font-weight: 700; }
  tr.total td.label .fr, tr.total td.label .en { color: #fff; }
  tr.subtotal td.label, tr.subtotal td.maxscore { background: var(--green); color: #fff; font-weight: 700; }
  tr.subtotal td.label .fr { color: #fff; }
  tr.yum td.label, tr.yum td.maxscore { background: var(--yellow); color: var(--green-dark); }
  tr.yum td.label .yum-word {
    font-family: "Arial Black", Arial, sans-serif;
    font-weight: 900;
    font-style: italic;
    font-size: 22px;
    color: var(--green-dark);
    letter-spacing: -1px;
    margin-right: 6px;
    vertical-align: middle;
  }

  .grand {
    margin-top: 12px;
    background: var(--green-dark);
    color: #fff;
    padding: 12px 14px;
    border-radius: 6px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 700;
    flex-wrap: wrap;
    gap: 8px;
  }
  .grand .winners {
    font-size: 13px;
    color: var(--yellow);
    font-weight: 700;
  }
  .grand-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .grand-cell {
    background: var(--yellow);
    color: var(--green-dark);
    padding: 6px 10px;
    border-radius: 4px;
    min-width: 46px;
    text-align: center;
    font-size: 16px;
  }
  .grand-cell .col { display: block; font-size: 9px; opacity: 0.75; font-weight: 700; }

  /* Dice icons */
  .die {
    display: inline-block;
    width: 18px;
    height: 18px;
    background: #fff;
    border: 1.2px solid var(--green-dark);
    border-radius: 3px;
    position: relative;
    vertical-align: middle;
    margin: 0 1px;
  }
  .die .pip {
    position: absolute;
    width: 3px;
    height: 3px;
    background: var(--green-dark);
    border-radius: 50%;
  }
  /* Bonus row dice slots */
  .picker.bonus-info .row-left {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 1;
    min-width: 0;
  }
  .picker.bonus-info .row-dice {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }
  .picker.bonus-info .row-dice .die {
    width: 14px;
    height: 14px;
    margin: 0;
  }
  .picker.bonus-info .row-dice .die .pip {
    width: 2.2px;
    height: 2.2px;
  }
  .picker.bonus-info .bonus-row.scratched .row-dice .die {
    opacity: 0.4;
  }

  /* Responsive */
  @media (max-width: 640px) {
    .card { margin: 8px; padding: 8px 6px 12px; }
    .header { grid-template-columns: 1fr; gap: 6px; text-align: center; }
    .player { justify-content: center; }
    .logo { justify-self: center; font-size: 30px; padding: 5px 10px 7px; }
    .title .fr { font-size: 15px; }
    .title .en { font-size: 13px; }
    table.sheet th, table.sheet td { height: 34px; font-size: 11px; }
    td.label .fr { font-size: 10.5px; }
    td.label .en { font-size: 9px; }
    td.label .num { font-size: 17px; }
    td.input-cell input { font-size: 16px; }
    td.maxscore { font-size: 12px; }
    table.sheet thead th { font-size: 9.5px; }
    tr.yum td.label .yum-word { font-size: 17px; }
    .toolbar h1 { font-size: 13px; }
  }

  /* 3D DICE THROW OVERLAY — ported from yum */
  #dice3dOverlay {
    position: fixed; inset: 0; z-index: 920;
    background:
      radial-gradient(circle at 50% 25%, var(--panel) 0%, var(--card) 55%, var(--bg) 100%);
    display: none; flex-direction: column;
    align-items: stretch; justify-content: stretch;
    opacity: 0; transition: opacity 0.28s ease;
  }
  #dice3dOverlay.open { opacity: 1; }
  #dice3dOverlay .d3d-title {
    font-family: "Arial Black", Impact, "Arial Narrow", sans-serif;
    font-size: 1.7rem; letter-spacing: 6px;
    color: var(--gold); text-align: center;
    padding: 22px 16px 6px;
    text-shadow: 0 0 22px rgba(244,200,66,0.45);
  }
  #dice3dOverlay .d3d-title::before,
  #dice3dOverlay .d3d-title::after {
    content: '◆'; color: rgba(195,220,210,0.55);
    font-size: 0.7em; margin: 0 12px; vertical-align: middle;
  }
  #dice3dOverlay .d3d-canvas-wrap {
    flex: 1; min-height: 0; position: relative; width: 100%;
  }
  #dice3dOverlay canvas {
    display: block; width: 100% !important; height: 100% !important;
    touch-action: none; cursor: grab;
  }
  #dice3dOverlay canvas:active { cursor: grabbing; }
  #dice3dOverlay .d3d-status {
    text-align: center; color: var(--white);
    font-size: 0.95rem; letter-spacing: 1px;
    padding: 10px 16px 4px; min-height: 24px;
  }
  #dice3dOverlay .d3d-cancel {
    align-self: center; margin: 8px 0 22px;
    padding: 9px 22px; border-radius: 22px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-weight: 700;
    font-size: 0.78rem; letter-spacing: 1px; cursor: pointer;
  }
  #dice3dOverlay .d3d-cancel:hover {
    background: rgba(255,255,255,0.12); color: var(--white);
  }
  #dice3dOverlay .d3d-hold-panel {
    display: none;
    justify-content: center;
    align-items: center;
    gap: 12px;
    padding: 6px 16px 0;
  }
  #dice3dOverlay .d3d-hold-btn {
    padding: 10px 22px;
    border-radius: 22px;
    border: 1.5px solid var(--gold);
    background: var(--gold);
    color: var(--green-dark);
    font-weight: 800;
    font-size: 0.85rem;
    letter-spacing: 1px;
    cursor: pointer;
    min-width: 110px;
  }
  #dice3dOverlay .d3d-hold-btn:active { transform: translateY(1px); }
  #dice3dOverlay .d3d-hold-btn.d3d-reroll {
    background: transparent;
    color: var(--white);
    border-color: rgba(255,255,255,0.45);
  }
  #dice3dOverlay .d3d-hold-btn.d3d-reroll:hover {
    background: rgba(255,255,255,0.1);
  }
  #dice3dOverlay .d3d-peek {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 5;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.32);

    color: var(--white);
    font-size: 0.78rem;

</style>

    <button type="button" class="sheet-tab" data-sheet="2" role="tab">2</button>

  <div class="header">
    <div class="logo" id="logoEl">
      <span class="yum-only">yum<span class="reg">®</span><span class="tag"><span class="fr">classique</span><span class="en">classic</span></span></span>
      <span class="yahtzee-only">YAHTZEE<span class="reg">®</span></span>

    </div>

  <!-- UPPER SECTION -->

        <th style="width:20%"><span class="fr">SCORE MAXIMAL</span><span class="en">MAXIMUM SCORE</span></th>
        <th class="col-num">1</th>
        <th class="col-num">2</th>
        <th class="col-num">3</th>

  <div class="grand">

</div>

<script src="dice-3d-throw.js"></script>
<script src="multiplayer.js"></script>
<script>
(function () {
  'use strict';

  const PLAYER_COUNT = 6;
  const SHEET_COUNT = 5;
  const LEGACY_KEY = 'yum-card-v1';
  const LEGACY_V2_PREFIX = 'yum-card-v2-sheet-';
  const LEGACY_V2_ACTIVE = 'yum-card-v2-active';
  const LANG_KEY = 'yum-card-lang';
  const MODE_KEY = 'yum-card-mode';

  let currentMode = 'yum';
  let activeSheet = 1;

  function storagePrefix() { return `yum-card-${currentMode}-v2-sheet-`; }
  function activeKey() { return `yum-card-${currentMode}-v2-active`; }

  const T = {
    fr: {
      docTitleYum: 'Yum — Fiche de pointage',
      docTitleYahtzee: 'Yahtzee — Fiche de pointage',
      newGameConfirm: 'Démarrer une nouvelle partie ? Tous les scores de cette feuille seront effacés.',
      clearColPrompt: 'Effacer quelle colonne ? (1–6)',
      resetAllConfirm: 'Réinitialiser TOUTES les feuilles ? Tous les scores seront effacés.',
      goodGame: (name) => `Bonne partie, ${name} !`,
      bestScore: (score, cols) => `Meilleur score : ${score} — Colonne${cols.length > 1 ? 's' : ''} ${cols.join(', ')}`,
      pickerClear: 'Effacer',
      pickerCancel: 'Annuler',
      pickerCol: (c) => `Col ${c}`,
      htmlLang: 'fr'
    },
    en: {
      docTitleYum: 'Yum — Score sheet',
      docTitleYahtzee: 'Yahtzee — Score sheet',
      newGameConfirm: 'Start a new game? All scores on this sheet will be cleared.',
      clearColPrompt: 'Clear which column? (1–6)',
      resetAllConfirm: 'Reset ALL sheets? All scores will be erased.',
      goodGame: (name) => `Have a good game, ${name}!`,
      bestScore: (score, cols) => `Best score: ${score} — Column${cols.length > 1 ? 's' : ''} ${cols.join(', ')}`,
      pickerClear: 'Clear',
      pickerCancel: 'Cancel',
      pickerCol: (c) => `Col ${c}`,
      htmlLang: 'en'
    }
  };

  let currentLang = 'fr';
  function tr() { return T[currentLang]; }
  function updateDocTitle() {
    document.title = currentMode === 'yahtzee'
      ? T[currentLang].docTitleYahtzee
      : T[currentLang].docTitleYum;
  }
  function setLang(lang) {
    if (!T[lang]) return;
    currentLang = lang;
    document.body.classList.toggle('lang-fr', lang === 'fr');
    document.body.classList.toggle('lang-en', lang === 'en');
    document.documentElement.lang = T[lang].htmlLang;
    updateDocTitle();
    document.querySelectorAll('#langToggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.lang === lang);
    });
    try { localStorage.setItem(LANG_KEY, lang); } catch (e) {}
    recompute();
  }

  // Die face pip positions (CSS top/left in % of die)
  const PIPS = {
    1: [[50,50]],
    2: [[25,25],[75,75]],
    3: [[25,25],[50,50],[75,75]],
    4: [[25,25],[25,75],[75,25],[75,75]],
    5: [[25,25],[25,75],[50,50],[75,25],[75,75]],
    6: [[25,25],[50,25],[75,25],[25,75],[50,75],[75,75]]
  };
  function dieHtml(n) {
    const pips = PIPS[n].map(([t,l]) =>
      `<span class="pip" style="top:${t}%;left:${l}%;transform:translate(-50%,-50%)"></span>`).join('');
    return `<span class="die">${pips}</span>`;
  }

  function bonusDiceHtml(value, diceCount) {
    const totalSlots = Math.max(3, diceCount);
    let html = '';
    for (let i = 0; i < totalSlots; i++) html += dieHtml(value);
    return `<span class="row-dice">${html}</span>`;
  }

  // Upper rows: 1s through 6s — max score is value × 5
  const UPPER_ROWS = [1,2,3,4,5,6].map(n => ({
    id: 'u' + n,
    labelFr: '',
    labelEn: '',
    num: n,
    max: n * 5,
    showDie: n,
    validate: (v) => v >= 0 && v <= n * 5 && v % n === 0
  }));

  // Lower section rows — populated per mode by setMode()
  const LOWER_ROWS_BY_MODE = {
    yum: [
      { id: 'l3k', labelFr: 'PAREILS', labelEn: 'OF A KIND', numLeft: 3,
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'l4k', labelFr: 'PAREILS', labelEn: 'OF A KIND', numLeft: 4,
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'lss', labelFr: 'COURTE SÉQUENCE DE', labelEn: 'SHORT STRAIGHT OF', numRight: 4,
        maxNum: 15, fixed: 15 },
      { id: 'lls', labelFr: 'LONGUE SÉQUENCE DE', labelEn: 'LONG STRAIGHT OF', numRight: 5,
        maxNum: 20, fixed: 20 },
      { id: 'lhr', labelFr: 'ROULEMENT DE SURPLUS', labelEn: 'HIGH ROLL',
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'lfh', labelFr: 'MAIN PLEINE', labelEn: 'FULL HOUSE', maxNum: 25, fixed: 25 },
      { id: 'lyum', labelFr: '5 PAREILS', labelEn: '5 OF A KIND', maxNum: 30, fixed: 30, yum: true }
    ],
    yahtzee: [
      { id: 'l3k', labelFr: 'PAREILS', labelEn: 'OF A KIND', numLeft: 3,
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'l4k', labelFr: 'PAREILS', labelEn: 'OF A KIND', numLeft: 4,
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'lfh', labelFr: 'MAIN PLEINE', labelEn: 'FULL HOUSE', maxNum: 25, fixed: 25 },
      { id: 'lss', labelFr: 'PETITE SUITE', labelEn: 'SMALL STRAIGHT', maxNum: 30, fixed: 30 },
      { id: 'lls', labelFr: 'GRANDE SUITE', labelEn: 'LARGE STRAIGHT', maxNum: 40, fixed: 40 },
      { id: 'lyahtzee', labelFr: 'YAHTZEE', labelEn: 'YAHTZEE', maxNum: 50, fixed: 50, yahtzee: true },
      { id: 'lchance', labelFr: 'CHANCE', labelEn: 'CHANCE',
        maxFr: 'TOTAL DES 5 DÉS', maxEn: 'TOTAL ALL DICE', maxNum: 30 },
      { id: 'lybonus', labelFr: 'BONUS YAHTZEE', labelEn: 'YAHTZEE BONUS',
        maxFr: '100 PAR BONUS', maxEn: '100 PER BONUS', maxNum: 300 }
    ]
  };
  let LOWER_ROWS = LOWER_ROWS_BY_MODE.yum;

  const upperBody = document.getElementById('upperBody');
  const lowerBody = document.getElementById('lowerBody');

  function buildUpperTable() {
    upperBody.innerHTML = '';
    UPPER_ROWS.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML =
        `<td class="label"><div class="label-inner upper-label"><span class="num">${r.num}</span><span class="dice">${dieHtml(r.showDie)}</span></div></td>` +
        `<td class="maxscore"><div class="max-inner"><span class="maxnum">${r.max}</span></div></td>` +
        colCells(r.id);
      upperBody.appendChild(tr);
    });

    const trSub = document.createElement('tr');
    trSub.className = 'subtotal computed';
    trSub.innerHTML =
      `<td class="label" colspan="2" style="text-align:center;color:#fff"><span class="fr">TOTAL PARTIEL</span><span class="en">SUB TOTAL</span></td>` +
      colCells('uSub', true);
    upperBody.appendChild(trSub);

    const bonusVal = currentMode === 'yahtzee' ? 35 : 25;
    const trBonus = document.createElement('tr');
    trBonus.className = 'bonus computed';
    trBonus.innerHTML =
      `<td class="label" style="background:var(--yellow)"><span class="fr" style="color:var(--green-dark);font-weight:700">BONI</span><span class="en" style="color:var(--green-dark);font-weight:700">BONUS</span></td>` +
      `<td class="label" style="background:var(--yellow);text-align:center"><div style="font-size:11px"><span class="fr">SI 63 OU PLUS</span><span class="en">IF 63 OR OVER</span></div><div style="font-size:18px;font-weight:900;margin-top:2px">${bonusVal}</div></td>` +
      colCells('uBonus', true);
    upperBody.appendChild(trBonus);

    const trUpperTotal = document.createElement('tr');
    trUpperTotal.className = 'total computed';
    trUpperTotal.innerHTML =
      `<td class="label" colspan="2" style="text-align:center"><span class="fr">TOTAL · PARTIE SUPÉRIEURE</span><span class="en">OF UPPER HALF</span></td>` +
      colCells('uTotal', true);
    upperBody.appendChild(trUpperTotal);
  }

  function buildLowerTable() {
    lowerBody.innerHTML = '';
    LOWER_ROWS.forEach(r => {
      const tr = document.createElement('tr');
      let labelHtml = '<td class="label">';
      if (r.yum) {
        labelHtml += `<div class="label-inner"><span class="yum-word">YUM</span><div class="label-text"><span class="fr">${r.labelFr}</span><span class="en">${r.labelEn}</span></div></div>`;
      } else if (r.yahtzee) {
        labelHtml += `<div class="label-inner"><span class="yum-word" style="color:#c8302c">YAHTZEE</span></div>`;
      } else if (r.numLeft) {
        labelHtml += `<div class="label-inner"><span class="num">${r.numLeft}</span><div class="label-text"><span class="fr">${r.labelFr}</span><span class="en">${r.labelEn}</span></div></div>`;
      } else if (r.numRight) {
        labelHtml += `<div class="label-inner"><div class="label-text"><span class="fr">${r.labelFr}</span><span class="en">${r.labelEn}</span></div><span class="num">${r.numRight}</span></div>`;
      } else {
        labelHtml += `<div class="label-inner"><div class="label-text"><span class="fr">${r.labelFr}</span><span class="en">${r.labelEn}</span></div></div>`;
      }
      labelHtml += '</td>';

      let maxHtml = '<td class="maxscore">';
      if (r.maxFr) {
        maxHtml += `<div class="maxlabel"><span class="fr">${r.maxFr}</span><span class="en">${r.maxEn}</span></div>`;
      } else {
        maxHtml += `<span class="maxnum">${r.maxNum}</span>`;
      }
      maxHtml += '</td>';

      tr.className = (r.yum || r.yahtzee) ? 'yum' : '';
      tr.innerHTML = labelHtml + maxHtml + colCells(r.id);
      lowerBody.appendChild(tr);
    });

    const trLowerTotal = document.createElement('tr');
    trLowerTotal.className = 'total computed';
    trLowerTotal.innerHTML =
      `<td class="label" colspan="2" style="text-align:center"><span class="fr">TOTAL · PARTIE INFÉRIEURE</span><span class="en">OF LOWER HALF</span></td>` +
      colCells('lTotal', true);
    lowerBody.appendChild(trLowerTotal);

    const trUpperCarry = document.createElement('tr');
    trUpperCarry.className = 'total computed';
    trUpperCarry.innerHTML =
      `<td class="label" colspan="2" style="text-align:center"><span class="fr">TOTAL · PARTIE SUPÉRIEURE</span><span class="en">OF UPPER HALF</span></td>` +
      colCells('uTotalCarry', true);
    lowerBody.appendChild(trUpperCarry);
  }

  // Build the grand total row in footer
  const grandRow = document.getElementById('grandRow');
  for (let c = 1; c <= PLAYER_COUNT; c++) {
    const div = document.createElement('div');
    div.className = 'grand-cell';
    div.innerHTML = `<span class="col">${c}</span><span id="grand-${c}">0</span>`;
    grandRow.appendChild(div);
  }

  function colCells(idPrefix, computed) {
    let html = '';
    for (let c = 1; c <= PLAYER_COUNT; c++) {
      const id = `${idPrefix}-${c}`;
      if (computed) {
        html += `<td class="input-cell"><input type="text" maxlength="3" id="${id}" data-col="${c}" data-row="${idPrefix}" readonly tabindex="-1"></td>`;
      } else {
        html += `<td class="input-cell" data-cell="${id}"><input type="text" maxlength="3" id="${id}" data-col="${c}" data-row="${idPrefix}" readonly></td>`;
      }
    }
    return html;
  }

  // ---- Picker ----
  const UPPER_PICKER = {
    u1: { kind: 'fixed', values: [0,1,2,3,4,5], titleFr: 'JEU DE DÉS 1', titleEn: 'ROLL 1' },
    u2: { kind: 'fixed', values: [0,2,4,6,8,10], titleFr: 'JEU DE DÉS 2', titleEn: 'ROLL 2' },
    u3: { kind: 'fixed', values: [0,3,6,9,12,15], titleFr: 'JEU DE DÉS 3', titleEn: 'ROLL 3' },
    u4: { kind: 'fixed', values: [0,4,8,12,16,20], titleFr: 'JEU DE DÉS 4', titleEn: 'ROLL 4' },
    u5: { kind: 'fixed', values: [0,5,10,15,20,25], titleFr: 'JEU DE DÉS 5', titleEn: 'ROLL 5' },
    u6: { kind: 'fixed', values: [0,6,12,18,24,30], titleFr: 'JEU DE DÉS 6', titleEn: 'ROLL 6' }
  };
  const LOWER_PICKER_BY_MODE = {
    yum: {
      l3k: { kind: 'sum', titleFr: '3 PAREILS', titleEn: '3 OF A KIND' },
      l4k: { kind: 'sum', titleFr: '4 PAREILS', titleEn: '4 OF A KIND' },
      lss: { kind: 'fixed', values: [0,15], titleFr: 'COURTE SÉQUENCE', titleEn: 'SHORT STRAIGHT' },
      lls: { kind: 'fixed', values: [0,20], titleFr: 'LONGUE SÉQUENCE', titleEn: 'LONG STRAIGHT' },
      lhr: { kind: 'sum', titleFr: 'ROULEMENT DE SURPLUS', titleEn: 'HIGH ROLL' },
      lfh: { kind: 'fixed', values: [0,25], titleFr: 'MAIN PLEINE', titleEn: 'FULL HOUSE' },
      lyum: { kind: 'fixed', values: [0,30], titleFr: 'YUM', titleEn: 'YUM — 5 OF A KIND' }
    },
    yahtzee: {
      l3k: { kind: 'sum', titleFr: '3 PAREILS', titleEn: '3 OF A KIND' },
      l4k: { kind: 'sum', titleFr: '4 PAREILS', titleEn: '4 OF A KIND' },
      lfh: { kind: 'fixed', values: [0,25], titleFr: 'MAIN PLEINE', titleEn: 'FULL HOUSE' },
      lss: { kind: 'fixed', values: [0,30], titleFr: 'PETITE SUITE', titleEn: 'SMALL STRAIGHT' },
      lls: { kind: 'fixed', values: [0,40], titleFr: 'GRANDE SUITE', titleEn: 'LARGE STRAIGHT' },
      lyahtzee: { kind: 'fixed', values: [0,50], titleFr: 'YAHTZEE', titleEn: 'YAHTZEE' },
      lchance: { kind: 'sum', titleFr: 'CHANCE', titleEn: 'CHANCE' },
      lybonus: { kind: 'fixed', values: [0,100,200,300,400,500,600], titleFr: 'BONUS YAHTZEE', titleEn: 'YAHTZEE BONUS' }
    }
  };
  let PICKER_OPTIONS = Object.assign({}, UPPER_PICKER, LOWER_PICKER_BY_MODE.yum);

  function sumOptions() {
    const arr = [0];
    for (let i = 5; i <= 30; i++) arr.push(i);
    return arr;
  }

  let activeInput = null;
  let backdrop = null;

  function openPicker(input) {
    closePicker();
    activeInput = input;
    const rowId = input.dataset.row;
    const col = input.dataset.col;
    const opt = PICKER_OPTIONS[rowId];
    if (!opt) return;
    const values = opt.kind === 'sum' ? sumOptions() : opt.values;
    const currentVal = input.value;

    const title = currentLang === 'en' ? opt.titleEn : opt.titleFr;
    backdrop = document.createElement('div');
    backdrop.className = 'picker-backdrop';
    backdrop.innerHTML = `
      <div class="picker" role="dialog" aria-modal="true">
        <div class="head">
          <div class="title">${title}</div>
          <div class="col">${tr().pickerCol(col)}</div>
        </div>
        <div class="chips ${opt.kind === 'sum' ? 'sum' : ''}">
          ${values.map(v => {
            const isCur = currentVal !== '' && parseInt(currentVal,10) === v;
            const cls = ['chip'];
            if (v === 0) cls.push('scratch');
            if (isCur) cls.push('current');
            return `<button type="button" class="${cls.join(' ')}" data-val="${v}">${v === 0 ? '✗' : v}</button>`;
          }).join('')}
        </div>
        <div class="actions">
          <button type="button" data-action="clear">${tr().pickerClear}</button>
          <button type="button" data-action="cancel" class="primary">${tr().pickerCancel}</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) { closePicker(); return; }
      const chip = e.target.closest('.chip');
      if (chip) {
        const v = chip.dataset.val;
        applyValue(v);
        closePicker();
        return;
      }
      const action = e.target.dataset.action;
      if (action === 'clear') { applyValue(''); closePicker(); }
      else if (action === 'cancel') closePicker();
    });
  }

  function applyValue(v) {
    if (!activeInput) return;
    activeInput.value = v;
    // Mark scratched cell visually
    const td = activeInput.closest('td');
    if (td) {
      if (v === '0' || v === 0) td.classList.add('scratched');
      else td.classList.remove('scratched');
    }
    recompute();
    save();
  }

  function closePicker() {
    if (backdrop && backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
    backdrop = null;
    if (activeInput) activeInput.blur();
    activeInput = null;
  }

  function openBonusInfo(col) {
    closePicker();
    const isFr = currentLang === 'fr';

    const rows = [];
    let total = 0;
    for (let n = 1; n <= 6; n++) {
      const el = document.getElementById(`u${n}-${col}`);
      const raw = el ? el.value : '';
      const parsed = raw === '' ? null : parseInt(raw, 10);
      const played = parsed !== null && !isNaN(parsed);
      const v = played ? parsed : 0;
      if (played) total += v;
      rows.push({ n, v, played, target: n * 3, diceCount: played ? Math.round(v / n) : 0 });
    }

    const need = Math.max(0, 63 - total);
    const reached = total >= 63;

    function rowStatus(r) {
      if (!r.played) {
        return {
          cls: '',
          text: isFr ? `besoin de 3 dés (${r.target} pts)` : `need 3 dice (${r.target} pts)`
        };
      }
      if (r.v === 0) {
        return { cls: 'scratched', text: isFr ? 'rayée' : 'scratched' };
      }
      if (r.diceCount === 3) {
        return { cls: 'complete', text: isFr ? 'complet ✓' : 'complete ✓' };
      }
      if (r.diceCount > 3) {
        const extra = r.diceCount - 3;
        return {
          cls: 'extra',
          text: isFr
            ? `+${extra} dé${extra > 1 ? 's' : ''} en plus`
            : `+${extra} extra di${extra > 1 ? 'ce' : 'e'}`
        };
      }
      const missing = 3 - r.diceCount;
      return {
        cls: 'short',
        text: isFr
          ? `manque ${missing} dé${missing > 1 ? 's' : ''} (${r.v}/${r.target})`
          : `need ${missing} more (${r.v}/${r.target})`
      };
    }

    const rowsHtml = rows.slice().reverse().map(r => {
      const s = rowStatus(r);
      return `<div class="bonus-row ${s.cls}">
          <div class="row-left">
            ${bonusDiceHtml(r.n, r.diceCount)}
            <span class="target">3 × ${r.n} = ${r.target}</span>
          </div>
          <span class="status">${s.text}</span>
        </div>`;
    }).join('');

    const bonusValue = currentMode === 'yahtzee' ? 35 : 25;
    const title = isFr ? `BONI 63 — Col ${col}` : `BONUS 63 — Col ${col}`;
    const summaryText = reached
      ? (isFr ? `Boni atteint ! ${total}/63 · +${bonusValue}` : `Bonus reached! ${total}/63 · +${bonusValue}`)
      : (isFr ? `Total : ${total}/63 — manque ${need} pts` : `Total: ${total}/63 — need ${need} pts`);

    backdrop = document.createElement('div');
    backdrop.className = 'picker-backdrop';
    backdrop.innerHTML = `
      <div class="picker bonus-info" role="dialog" aria-modal="true">
        <div class="head">
          <div class="title">${title}</div>
        </div>
        <div class="bonus-list">${rowsHtml}</div>
        <div class="summary ${reached ? 'reached' : ''}">${summaryText}</div>
        <div class="actions">
          <button type="button" data-action="ok" class="primary">OK</button>
        </div>
      </div>`;
    document.body.appendChild(backdrop);

    backdrop.addEventListener('click', (e) => {
      if (e.target === backdrop) { closePicker(); return; }
      if (e.target.dataset && e.target.dataset.action === 'ok') { closePicker(); }
    });
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closePicker();
  });

  // ---- State + Compute ----
  function getNum(id) {
    const el = document.getElementById(id);
    if (!el) return 0;
    const v = parseInt(el.value, 10);
    return isNaN(v) ? 0 : v;
  }
  function setComputed(id, val, showZero) {
    const el = document.getElementById(id);
    if (!el) return;
    el.value = (val === 0 && !showZero) ? '' : String(val);
  }

  function recompute() {
    let bestTotal = -1;
    const totals = [];
    for (let c = 1; c <= PLAYER_COUNT; c++) {
      // Upper subtotal
      let sub = 0;
      for (let n = 1; n <= 6; n++) sub += getNum(`u${n}-${c}`);
      setComputed(`uSub-${c}`, sub);

      // Bonus
      const bonusValue = currentMode === 'yahtzee' ? 35 : 25;
      const bonus = sub >= 63 ? bonusValue : 0;
      setComputed(`uBonus-${c}`, bonus, sub >= 63);

      // Upper total
      const upperTotal = sub > 0 || bonus > 0 ? sub + bonus : 0;
      setComputed(`uTotal-${c}`, upperTotal);
      setComputed(`uTotalCarry-${c}`, upperTotal);

      // Lower total
      let lower = 0;
      LOWER_ROWS.forEach(r => { lower += getNum(`${r.id}-${c}`); });
      setComputed(`lTotal-${c}`, lower);

      // Grand
      const grand = upperTotal + lower;
      totals.push(grand);
      const g = document.getElementById(`grand-${c}`);
      if (g) g.textContent = String(grand);
      if (grand > bestTotal) bestTotal = grand;
    }
    // Winner line
    const playerName = (document.getElementById('playerName').value || '').trim();
    const winnerLine = document.getElementById('winnerLine');
    const anyScore = totals.some(t => t > 0);
    if (!anyScore) {
      winnerLine.textContent = playerName ? tr().goodGame(playerName) : '';
    } else {
      const winners = [];
      totals.forEach((t, i) => { if (t === bestTotal && t > 0) winners.push(i + 1); });
      winnerLine.textContent = tr().bestScore(bestTotal, winners);
    }
  }

  // ---- Persistence (one storage key per mode × sheet) ----
  function save() {
    const data = { player: document.getElementById('playerName').value, cells: {} };
    document.querySelectorAll('td.input-cell[data-cell] input').forEach(inp => {
      if (inp.value !== '') data.cells[inp.id] = inp.value;
    });
    try { localStorage.setItem(storagePrefix() + activeSheet, JSON.stringify(data)); } catch (e) {}
    updateSheetTabs();
  }
  function clearDOMCells() {
    document.querySelectorAll('td.input-cell[data-cell] input').forEach(i => {
      i.value = '';
      const td = i.closest('td');
      if (td) td.classList.remove('scratched');
    });
    document.getElementById('playerName').value = '';
  }
  function loadSheet(n) {
    clearDOMCells();
    try {
      const raw = localStorage.getItem(storagePrefix() + n);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (data.player) document.getElementById('playerName').value = data.player;
      if (data.cells) {
        Object.keys(data.cells).forEach(k => {
          const el = document.getElementById(k);
          if (el) {
            el.value = data.cells[k];
            if (data.cells[k] === '0') {
              const td = el.closest('td');
              if (td) td.classList.add('scratched');
            }
          }
        });
      }
    } catch (e) {}
  }
  function migrateLegacy() {
    // v1 single-sheet → yum mode sheet 1
    try {
      const yumPrefix = 'yum-card-yum-v2-sheet-';
      const legacy = localStorage.getItem(LEGACY_KEY);
      if (legacy && !localStorage.getItem(yumPrefix + 1)) {
        localStorage.setItem(yumPrefix + 1, legacy);
      }
      if (legacy) localStorage.removeItem(LEGACY_KEY);
    } catch (e) {}
    // v2 single-mode sheets → yum mode (preserve existing user data)
    try {
      const yumPrefix = 'yum-card-yum-v2-sheet-';
      for (let i = 1; i <= SHEET_COUNT; i++) {
        const old = localStorage.getItem(LEGACY_V2_PREFIX + i);
        if (old && !localStorage.getItem(yumPrefix + i)) {
          localStorage.setItem(yumPrefix + i, old);
        }
        if (old) localStorage.removeItem(LEGACY_V2_PREFIX + i);
      }
      const oldActive = localStorage.getItem(LEGACY_V2_ACTIVE);
      if (oldActive && !localStorage.getItem('yum-card-yum-v2-active')) {
        localStorage.setItem('yum-card-yum-v2-active', oldActive);
      }
      if (oldActive) localStorage.removeItem(LEGACY_V2_ACTIVE);
    } catch (e) {}
  }
  function loadActiveSheet() {
    activeSheet = 1;
    try {
      const a = parseInt(localStorage.getItem(activeKey()), 10);
      if (a >= 1 && a <= SHEET_COUNT) activeSheet = a;
    } catch (e) {}
    loadSheet(activeSheet);
    updateSheetTabs();
  }
  function switchSheet(n) {
    if (!n || n < 1 || n > SHEET_COUNT || n === activeSheet) return;
    save();
    activeSheet = n;
    try { localStorage.setItem(activeKey(), String(n)); } catch (e) {}
    loadSheet(n);
    updateSheetTabs();
    recompute();
  }
  function resetAllSheets() {
    for (let i = 1; i <= SHEET_COUNT; i++) {
      try { localStorage.removeItem(storagePrefix() + i); } catch (e) {}
    }
    try { localStorage.removeItem(activeKey()); } catch (e) {}
    activeSheet = 1;
    clearDOMCells();
    updateSheetTabs();
    recompute();
  }

  function sheetGrandTotal(n) {
    let cells;
    if (n === activeSheet) {
      cells = {};
      document.querySelectorAll('td.input-cell input').forEach(inp => {
        if (inp.value !== '') cells[inp.id] = inp.value;
      });
    } else {
      try {
        const raw = localStorage.getItem(storagePrefix() + n);
        cells = raw ? (JSON.parse(raw).cells || {}) : {};
      } catch (e) { cells = {}; }
    }
    const bonusValue = currentMode === 'yahtzee' ? 35 : 25;
    let total = 0;
    for (let c = 1; c <= PLAYER_COUNT; c++) {
      let sub = 0;
      for (let i = 1; i <= 6; i++) {
        const v = parseInt(cells['u' + i + '-' + c], 10);
        if (!isNaN(v)) sub += v;
      }
      const bonus = sub >= 63 ? bonusValue : 0;
      const upper = (sub > 0 || bonus > 0) ? sub + bonus : 0;
      let lower = 0;
      LOWER_ROWS.forEach(r => {
        const v = parseInt(cells[r.id + '-' + c], 10);
        if (!isNaN(v)) lower += v;
      });
      total += upper + lower;
    }
    return total;
  }
  function sheetPlayer(n) {
    if (n === activeSheet) return (document.getElementById('playerName').value || '').trim();
    try {
      const raw = localStorage.getItem(storagePrefix() + n);
      return raw ? ((JSON.parse(raw).player || '').trim()) : '';
    } catch (e) { return ''; }
  }
  function updateSheetTabs() {
    document.querySelectorAll('.sheet-tab').forEach(tab => {
      const n = parseInt(tab.dataset.sheet, 10);
      const name = sheetPlayer(n);
      const total = sheetGrandTotal(n);
      tab.classList.toggle('active', n === activeSheet);
      const label = total > 0 ? (n + ' · ' + total) : String(n);
      tab.innerHTML = label + (name ? '<span class="tab-name">' + name + '</span>' : '');
    });
  }

  // ---- Input handling (re-bind after rebuild) ----
  function attachCellHandlers() {
    document.querySelectorAll('td.input-cell[data-cell] input').forEach(inp => {
      const open = (e) => { e.preventDefault(); openPicker(inp); };
      inp.addEventListener('click', open);
      inp.addEventListener('focus', open);
    });
    document.querySelectorAll('tr.bonus td.input-cell').forEach(td => {
      td.addEventListener('click', () => {
        const inp = td.querySelector('input');
        if (!inp) return;
        const col = parseInt(inp.dataset.col, 10);
        if (col) openBonusInfo(col);
      });
    });
  }
  document.getElementById('playerName').addEventListener('input', () => {
    recompute(); save();
  });

  document.getElementById('newGameBtn').addEventListener('click', () => {
    if (!confirm(tr().newGameConfirm)) return;
    clearDOMCells();
    try { localStorage.removeItem(storagePrefix() + activeSheet); } catch (e) {}
    recompute();
    updateSheetTabs();
  });

  document.getElementById('resetColBtn').addEventListener('click', () => {
    const col = prompt(tr().clearColPrompt);
    const c = parseInt(col, 10);
    if (!c || c < 1 || c > PLAYER_COUNT) return;
    document.querySelectorAll(`td.input-cell[data-cell] input[data-col="${c}"]`).forEach(i => {
      i.value = '';
      i.closest('td').classList.remove('scratched');
    });
    recompute(); save();
  });

  document.getElementById('resetAllBtn').addEventListener('click', () => {
    if (!confirm(tr().resetAllConfirm)) return;
    resetAllSheets();
  });

  function setMode(mode) {
    if (mode !== 'yum' && mode !== 'yahtzee') return;
    // Save current sheet to its mode-storage before swapping
    if (upperBody.children.length > 0) save();

    currentMode = mode;
    document.body.classList.toggle('mode-yum', mode === 'yum');
    document.body.classList.toggle('mode-yahtzee', mode === 'yahtzee');
    const logoEl = document.getElementById('logoEl');
    if (logoEl) logoEl.classList.toggle('yahtzee-logo', mode === 'yahtzee');
    document.querySelectorAll('#modeToggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.mode === mode);
    });

    LOWER_ROWS = LOWER_ROWS_BY_MODE[mode];
    PICKER_OPTIONS = Object.assign({}, UPPER_PICKER, LOWER_PICKER_BY_MODE[mode]);

    buildUpperTable();
    buildLowerTable();
    attachCellHandlers();

    loadActiveSheet();
    updateDocTitle();
    try { localStorage.setItem(MODE_KEY, mode); } catch (e) {}
    recompute();
  }

  document.getElementById('modeToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (btn) setMode(btn.dataset.mode);
  });

  document.getElementById('sheetTabs').addEventListener('click', (e) => {
    const t = e.target.closest('.sheet-tab');
    if (!t) return;
    const n = parseInt(t.dataset.sheet, 10);
    if (n) switchSheet(n);
  });

  document.getElementById('langToggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-lang]');
    if (btn) setLang(btn.dataset.lang);
  });

  // ---- 3D dice roll ----
  const rollBtn = document.getElementById('rollBtn');
  const rollResult = document.getElementById('rollResult');
  let rollHideTimer = null;
  function showRollResult(values) {
    if (rollHideTimer) { clearTimeout(rollHideTimer); rollHideTimer = null; }
    rollResult.innerHTML = values.map(v => dieHtml(v)).join('');
    rollResult.classList.add('show');
    rollHideTimer = setTimeout(() => rollResult.classList.remove('show'), 20000);
  }
  rollBtn.addEventListener('click', () => {
    const fn = window.throw3DDiceTurn || window.throw3DDice;
    if (typeof fn !== 'function') return;
    rollBtn.disabled = true;
    fn(5).then(values => {
      if (Array.isArray(values) && values.length) showRollResult(values);
    }).catch(() => {}).then(() => {
      rollBtn.disabled = false;
    });
  });

  // Init
  let savedLang = null, savedMode = null;
  try { savedLang = localStorage.getItem(LANG_KEY); } catch (e) {}
  try { savedMode = localStorage.getItem(MODE_KEY); } catch (e) {}
  migrateLegacy();
  setLang(savedLang === 'en' ? 'en' : 'fr');
  setMode(savedMode === 'yahtzee' ? 'yahtzee' : 'yum');
})();
</script>
